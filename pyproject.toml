[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tieredfl"
version = "0.1.0"
description = "Tiered federated learning for ECG classification on heterogeneous devices"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Osama Shallal" }]
keywords = ["federated-learning", "reservoir-computing", "ecg", "edge-computing"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
tieredfl = "tieredfl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# numpy built against Apple Accelerate raises floating point warnings from inside BLAS
# calls; a bare `a.T @ a` on random data is enough to trigger one, so they carry no
# information about the arrays involved.
filterwarnings = [
    "ignore:.*encountered in matmul:RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
